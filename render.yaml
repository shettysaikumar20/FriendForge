services:
  - type: web
    name: friendforge
    runtime: node
    plan: free

    buildCommand: npm --prefix backend ci && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: npm --prefix backend start

    healthCheckPath: /api/health
    autoDeployTrigger: "off"

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "24"

      - key: BACKBOARD_API_KEY
        sync: false

      - key: ELEVENLABS_API_KEY
        sync: false

      - key: APP_PASSWORD
        sync: false