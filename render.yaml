services:
  - type: web
    name: friendforge
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: friendforge-state
      mountPath: /var/data/friendforge
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data/friendforge
      - key: BACKBOARD_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
